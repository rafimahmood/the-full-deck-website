name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: No secrets committed
        run: |
          if git grep -nE '[0-9a-f]{32}-us[0-9]{1,2}' -- . ':!.env.example' ':!tests' ':!README.md'; then
            echo "::error::Something that looks like a Mailchimp API key is committed. Remove it and rotate the key."; exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::A .env file is tracked by git."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Compiled js/ is up to date
        run: |
          npm run build
          git diff --exit-code -- js || { echo "::error::js/ is out of date. Run npm run build and commit it."; exit 1; }
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
