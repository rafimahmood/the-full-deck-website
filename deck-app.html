<style>
  @font-face{font-family:'Alfa Slab One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/alfa-slab-one.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
  @font-face{font-family:'Karla';font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/karla.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
  @font-face{font-family:'Space Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/space-mono-400.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
  @font-face{font-family:'Space Mono';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/space-mono-700.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
  :root{
    --cream:#F6F1E7;
    --paper:#EFE7D6;
    --ink:#2B2118;
    --word:#1D4E5F;
    --dinner:#B5791E;
    --active:#B5482A;
    --sp-1:8px;
    --sp-2:16px;
    --sp-3:24px;
    --sp-4:32px;
    --band-text:#F6F1E7;
    --border-soft: rgba(43,33,24,0.25);
    --border-faint: rgba(43,33,24,0.12);
    --border-card: rgba(43,33,24,0.15);
    --bg-dot: rgba(43,33,24,0.05);
    --muted: #8a7a63;
    --muted-strong: #5c4d3a;
    --rules-text: #3a2e22;
    --premium: #8B6F1F;
    --brand: #B5482A;
  }
  html[data-theme="dark"]{
    --cream:#221A12;
    --paper:#2E251B;
    --ink:#F3EAD9;
    --border-soft: rgba(243,234,217,0.25);
    --border-faint: rgba(243,234,217,0.12);
    --border-card: rgba(243,234,217,0.15);
    --bg-dot: rgba(243,234,217,0.05);
    --muted: #B8A78C;
    --muted-strong: #D8C7A8;
    --rules-text: #EDE3D0;
    --premium: #D4AF6A;
    --brand: #B5482A;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; }
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Karla', sans-serif;
    background-image: radial-gradient(circle at 1px 1px, var(--bg-dot) 1px, transparent 0);
    background-size: 22px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;
    padding: var(--sp-4) 18px 48px;
    transition: background-color .25s ease, color .25s ease;
  }

  @keyframes cardInFade{ from{ opacity:0; transform:translateY(10px) scale(0.98); } to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes cardInRight{ from{ opacity:0; transform:translateX(50px) rotate(4deg); } to{ opacity:1; transform:translateX(0) rotate(0); } }
  @keyframes cardInLeft{ from{ opacity:0; transform:translateX(-50px) rotate(-4deg); } to{ opacity:1; transform:translateX(0) rotate(0); } }
  .card.enter-fade{ animation: cardInFade .3s ease; }
  .card.enter-right{ animation: cardInRight .3s ease; }
  .card.enter-left{ animation: cardInLeft .3s ease; }

  .theme-toggle{
    position:fixed;
    top:16px; right:16px;
    width:38px; height:38px;
    border-radius:100px;
    border:1.5px solid var(--border-soft);
    background:var(--paper);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:30;
  }
  .theme-toggle .moon-icon{ display:none; }
  html[data-theme="dark"] .theme-toggle .sun-icon{ display:none; }
  html[data-theme="dark"] .theme-toggle .moon-icon{ display:block; }

  .home-link{
    position:fixed;
    top:16px; left:16px;
    height:38px;
    padding:0 14px;
    border-radius:100px;
    border:1.5px solid var(--border-soft);
    background:var(--paper);
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:6px;
    text-decoration:none;
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    z-index:30;
  }

  /* Keep the logo clear of the fixed Home and theme buttons on narrow screens. */
  @media (max-width:520px){
    body{ padding-top:68px; }
  }

  .icon-svg{
    width:16px;
    height:16px;
    display:inline-block;
    vertical-align:-3px;
  }
  .icon-svg.lg{ width:20px; height:20px; vertical-align:-5px; }

  header{
    width:100%;
    max-width:420px;
    text-align:center;
    margin-bottom:var(--sp-4);
  }
  .logo{
    font-family:'Alfa Slab One', serif;
    font-size:26px;
  }
  .logo span{ color:var(--brand); }
  .tagline{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    opacity:0.7;
    margin-top:4px;
  }

  .filters{
    width:100%;
    max-width:420px;
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:var(--sp-2);
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Space Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:11px 16px;
    border-radius:100px;
    border:1.5px solid var(--border-soft);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    transition: all .15s;
    opacity:0.5;
  }
  .chip.active{
    opacity:1;
    color:var(--band-text);
    border-color:transparent;
  }
  .chip[data-cat="all"].active{ background:var(--ink); color:var(--cream); }
  .chip[data-cat="word"].active{ background:var(--word); }
  .chip[data-cat="dinner"].active{ background:var(--dinner); }
  .chip[data-cat="active"].active{ background:var(--active); }

  .stage{
    width:100%;
    max-width:340px;
    position:relative;
    margin-bottom:var(--sp-3);
  }
  /* The card is at least 5:7 and grows with long rules. */
  .stage .card{
    position:relative;
    inset:auto;
    min-height:calc(min(340px, 100vw - 36px) * 7 / 5);
  }

  .card{
    position:absolute;
    inset:0;
    background:var(--cream);
    border-radius:18px;
    border:2px solid var(--border-card);
    box-shadow: 0 24px 50px -18px rgba(0,0,0,0.4);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    cursor:grab;
  }

  .band{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    color:var(--band-text);
  }
  .band .cat-label{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
  }

  .card-body{
    flex:1;
    padding:22px 22px 18px;
    display:flex;
    flex-direction:column;
  }
  .title{
    font-family:'Alfa Slab One', serif;
    font-weight:400;
    font-size:24px;
    letter-spacing:-0.01em;
    line-height:1.1;
    margin-bottom:var(--sp-2);
  }
  .meta{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted-strong);
    margin-bottom:var(--sp-2);
    padding-bottom:var(--sp-2);
    border-bottom:1px solid var(--border-faint);
  }
  .meta b{ color:var(--ink); }
  .rules{
    font-size:14.5px;
    line-height:1.55;
    color:var(--rules-text);
    overflow-y:auto;
    overflow-x:hidden;
    cursor:default;
  }

  .rules .r-line{ margin:0 0 var(--sp-2); }
  .rules .r-label{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted-strong);
    margin-right:6px;
  }
  .rules ol{ margin:0 0 var(--sp-2); padding-left:1.3em; }
  .rules li{ margin-bottom:2px; }

  .reveal-prompt{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    text-align:center;
    padding:18px 12px;
    border:1.5px dashed var(--border-soft);
    border-radius:12px;
    cursor:pointer;
    color:var(--muted-strong);
  }
  .reveal-prompt .icon-svg{ width:22px; height:22px; }
  .reveal-prompt .reveal-label{
    font-size:12.5px;
    line-height:1.4;
  }
  .reveal-prompt .reveal-cta{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    opacity:0.7;
  }
  .reveal-content{ display:none; }
  .reveal-block.revealed .reveal-prompt{ display:none; }
  .reveal-block.revealed .reveal-content{ display:block; }
  .diagram-block{ margin-top:var(--sp-2); }

  .premium-tag{
    display:inline-flex;
    align-items:center;
    gap:3px;
    color:var(--premium);
  }
  .premium-tag .icon-svg{ width:11px; height:11px; }

  .locked-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    text-align:center;
    padding:20px 14px;
    border:1.5px dashed var(--premium);
    border-radius:12px;
    color:var(--muted-strong);
  }
  .locked-panel .icon-svg{ width:22px; height:22px; color:var(--premium); }
  .locked-panel .locked-title{
    font-family:'Alfa Slab One', serif;
    font-weight:400;
    font-size:14px;
    color:var(--premium);
  }
  .locked-panel .locked-desc{
    font-size:12.5px;
    line-height:1.4;
  }

  .empty-state{
    display:flex;
    align-items:center;
    justify-content:center;
    flex:1;
    text-align:center;
    padding:30px;
    font-family:'Space Mono', monospace;
    font-size:13px;
    color:var(--muted);
    cursor:pointer;
  }

  .controls{
    width:100%;
    max-width:340px;
    display:flex;
    gap:10px;
  }
  .btn{
    flex:1;
    font-family:'Space Mono', monospace;
    font-size:13px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:16px 10px;
    border-radius:100px;
    border:none;
    cursor:pointer;
    text-align:center;
  }
  .btn-primary{ background:var(--ink); color:var(--cream); }
  .btn-primary:active{ transform: scale(0.97); }
  .btn-ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--border-soft); flex:0 0 auto; padding:16px 18px; }

  .deck-count{
    margin-top:14px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:#8a7a63;
  }

  .mode-toggle{
    width:100%;
    max-width:420px;
    display:flex;
    justify-content:center;
    gap:var(--sp-4);
    border-bottom:1px solid var(--border-soft);
    margin-bottom:var(--sp-4);
  }
  .mode-btn{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:0 2px var(--sp-1);
    border:none;
    background:transparent;
    color:var(--ink);
    opacity:0.5;
    cursor:pointer;
    position:relative;
  }
  .mode-btn.active{ opacity:1; }
  .mode-btn.active::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:2px;
    background:var(--active);
  }

  .list-panel{
    width:100%;
    max-width:420px;
    display:none;
    flex-direction:column;
    gap:var(--sp-1);
  }
  .list-panel.visible{ display:flex; }
  .list-row{
    background:var(--paper);
    border-radius:12px;
    padding:14px 16px;
    border-left:5px solid var(--ink);
    cursor:pointer;
  }
  .list-row.word{ border-color:var(--word); }
  .list-row.dinner{ border-color:var(--dinner); }
  .list-row.active-cat{ border-color:var(--active); }
  .list-row .lr-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .list-row .lr-title{
    font-family:'Alfa Slab One', serif;
    font-weight:400;
    font-size:15px;
    letter-spacing:-0.01em;
  }
  .list-row .lr-chevron{
    font-family:'Space Mono', monospace;
    font-size:13px;
    opacity:0.4;
    flex:0 0 auto;
  }
  .list-row .lr-meta{
    font-family:'Space Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted-strong);
    margin-top:4px;
  }
  .list-empty{
    text-align:center;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--muted);
    padding:30px 10px;
  }

  .list-detail{
    display:none;
    flex-direction:column;
    align-items:center;
    width:100%;
  }
  .list-detail.visible{ display:flex; }
  .detail-topbar{
    width:100%;
    max-width:340px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:var(--sp-2);
  }
  .btn-icon{
    background:transparent;
    border:none;
    cursor:pointer;
    font-family:'Space Mono', monospace;
    font-size:13px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--ink);
    padding:4px;
  }
  .detail-counter{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--muted-strong);
  }
  .detail-nav{
    width:100%;
    max-width:340px;
    display:flex;
    gap:10px;
    margin-top:var(--sp-2);
  }
  .detail-nav .btn-ghost{ flex:1; }

  /* Horizontal drags on the card are swipes, so only vertical panning is left to the browser.
     touch-action isn't inherited, and the scrollable rules area has its own, so cover every
     element inside the card (otherwise a swipe that starts on the rules text is cancelled). */
  .card, .card *{ touch-action:pan-y; }
  .title-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:var(--sp-2);
  }
  .title-row .title{ margin-bottom:0; }
  .share-btn{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:7px 11px;
    border-radius:100px;
    border:1.5px solid var(--border-soft);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }
  .share-btn:hover{ background:var(--paper); }

  .filter-bar{
    width:100%;
    max-width:420px;
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:var(--sp-1);
  }
  .fb-field{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--muted-strong);
  }
  .fb-field select{
    font-family:'Karla', sans-serif;
    font-size:16px;
    padding:8px 12px;
    border-radius:100px;
    border:1.5px solid var(--border-soft);
    background:var(--paper);
    color:var(--ink);
  }
  .toggle-chip{
    font-family:'Space Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:11px 16px;
    border-radius:100px;
    border:1.5px solid var(--border-soft);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    opacity:0.6;
  }
  .toggle-chip[aria-pressed="true"]{ opacity:1; background:var(--ink); color:var(--cream); border-color:transparent; }
  .result-count{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:var(--sp-2);
  }
  .lr-secret{ white-space:nowrap; }
  .list-empty .btn-icon{ margin-top:var(--sp-1); text-decoration:underline; }

  .fs{
    position:fixed;
    inset:0;
    z-index:25;
    display:flex;
    flex-direction:column;
    padding:64px 14px 14px;
    background:var(--cream);
    background-image: radial-gradient(circle at 1px 1px, var(--bg-dot) 1px, transparent 0);
    background-size: 22px 22px;
  }
  .fs[hidden]{ display:none; }
  .fs-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:0 4px var(--sp-1);
  }
  .fs-hint{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--muted-strong);
  }
  .fs-stage{ position:relative; flex:1; min-height:0; }
  .fs-stage .card{ position:absolute; inset:0; min-height:0; }
  .fs .card-body, .fs .rules{ min-height:0; }
  .fs-stage .rules{ font-size:16px; flex:1; }
  .fs-nav{ display:flex; gap:10px; margin-top:var(--sp-1); }
  .fs-nav .btn-ghost{ flex:1; padding:13px 10px; }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translate(-50%, 20px);
    max-width:calc(100% - 36px);
    padding:11px 18px;
    border-radius:100px;
    background:var(--ink);
    color:var(--cream);
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.03em;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:40;
    overflow-wrap:anywhere;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  footer{
    margin-top:30px;
    font-family:'Space Mono', monospace;
    font-size:10px;
    opacity:0.75;
    text-align:center;
  }
</style>
</head>
<body>

<a class="home-link" href="index.html">
  <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  Home
</a>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
  <svg class="icon-svg sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="icon-svg moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
</button>

<main>
<header>
  <div class="logo">The <span>Full</span> <span>Deck</span></div>
  <div class="tagline">Tap a category. Draw a card.</div>
</header>

<div class="filters" id="filters">
  <button class="chip active" data-cat="all">All</button>
  <button class="chip" data-cat="word"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Word</button>
  <button class="chip" data-cat="dinner"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V2"/><path d="M5 12v10"/><path d="M18 2c-1.7 0-3 2.2-3 5.5S16.3 13 18 13s3-2.2 3-5.5S19.7 2 18 2z"/><path d="M18 13v9"/></svg> Dinner</button>
  <button class="chip" data-cat="active"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg> Active</button>
</div>

<div class="filter-bar" id="filterBar">
  <label class="fb-field">How many of you?
    <select id="playersSelect" aria-label="How many of you?">
      <option value="">Any number</option>
      <option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
      <option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
      <option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option>
      <option value="14">14</option><option value="15">15</option><option value="16">16</option>
    </select>
  </label>
  <button class="toggle-chip" type="button" id="noEquipBtn" aria-pressed="false">No equipment needed</button>
</div>
<div class="result-count" id="resultCount" aria-live="polite"></div>

<div class="mode-toggle" id="modeToggle">
  <button class="mode-btn" data-mode="random"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1" fill="currentColor" stroke="none"/></svg> Randomize</button>
  <button class="mode-btn active" data-mode="list"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg> List</button>
</div>

<div class="stage" id="stage"></div>

<div class="controls" id="randomControls">
  <button class="btn btn-primary" id="drawBtn">Draw a card</button>
</div>
<div class="deck-count" id="deckCount"></div>
<div class="list-panel" id="listPanel"></div>

<div class="list-detail" id="listDetail">
  <div class="detail-topbar">
    <button class="btn-icon" id="detailBack">‹ Back to list</button>
    <span class="detail-counter" id="detailCounter"></span>
  </div>
  <div class="stage" id="detailStage"></div>
  <div class="detail-nav">
    <button class="btn btn-ghost" id="detailPrev">‹ Prev</button>
    <button class="btn btn-ghost" id="detailNext">Next ›</button>
  </div>
</div>

<div class="fs" id="fs" hidden>
  <div class="fs-bar">
    <button class="btn-icon" type="button" id="fsClose">✕ Close</button>
    <span class="fs-hint" id="fsHint"></span>
  </div>
  <div class="fs-stage" id="fsStage"></div>
  <div class="fs-nav">
    <button class="btn btn-ghost" type="button" id="fsPrev">‹ Prev</button>
    <button class="btn btn-ghost" type="button" id="fsNext">Next ›</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

</main>

<footer>THE FULL DECK</footer>

<script type="module">
import { Deck, NO_FILTERS, findGameById, listSetup, parseShareHash, rulesHTML, shareHash, shareUrl, swipeDirection, visibleGames } from './js/deck.js';
import { GAMES } from './js/games.js';

const $ = (id) => document.getElementById(id);
const svg = (inner, cls = 'icon-svg') =>
  `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;

const ICONS = {
  word: svg('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>', 'icon-svg lg'),
  dinner: svg('<path d="M3 2v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V2"/><path d="M5 12v10"/><path d="M18 2c-1.7 0-3 2.2-3 5.5S16.3 13 18 13s3-2.2 3-5.5S19.7 2 18 2z"/><path d="M18 13v9"/>', 'icon-svg lg'),
  active: svg('<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>', 'icon-svg lg'),
  eye: svg('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
  play: svg('<polygon points="5 3 19 12 5 21 5 3"/>'),
  link: svg('<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'),
};

const CATS = {
  word:   { label: "Word Games",   color: "var(--word)" },
  dinner: { label: "Dinner Games", color: "var(--dinner)" },
  active: { label: "Active",       color: "var(--active)" },
};

const filters = { ...NO_FILTERS };
let mode = "list"; // "random" | "list"
const phone = window.matchMedia('(max-width: 640px)');

function filteredGames(){
  return visibleGames(GAMES, filters);
}

const DIAGRAMS = {
  // Add entries here later, e.g. video embeds: "Game Title": `<video ...>...</video>`
};

function renderEmpty(msg){
  $('stage').innerHTML =
    `<div class="card enter-fade"><div class="empty-state">${msg}</div></div>`;
}

function cardHTML(game, enterClass){
  const c = CATS[game.cat];
  const rulesBlock = game.spoiler
    ? `<div class="rules">
         <div class="reveal-block spoiler-block">
           <div class="reveal-prompt">
             ${ICONS.eye}
             <span class="reveal-label">Secret rule: one player peeks, everyone else looks away.</span>
             <span class="reveal-cta">Tap to reveal</span>
           </div>
           <div class="reveal-content">${rulesHTML(game.rules)}</div>
         </div>
       </div>`
    : `<div class="rules">${rulesHTML(game.rules)}</div>`;
  const diagramBlock = (game.diagram && DIAGRAMS[game.title])
    ? `<div class="reveal-block diagram-block">
         <div class="reveal-prompt">
           ${ICONS.play}
           <span class="reveal-label">See how it works</span>
           <span class="reveal-cta">Tap to view</span>
         </div>
         <div class="reveal-content">${DIAGRAMS[game.title]}</div>
       </div>`
    : '';
  return `
    <div class="card ${enterClass || ''}">
      <div class="band" style="background:${c.color}">
        <span class="cat-label">${c.label}</span>
        <span class="icon">${ICONS[game.cat]}</span>
      </div>
      <div class="card-body">
        <div class="title-row">
          <div class="title">${game.title}</div>
          <button class="share-btn" type="button" data-share="${game.id}" aria-label="Copy a link to ${game.title}">${ICONS.link} Share</button>
        </div>
        <div class="meta"><span><b>Players</b> ${game.players}</span><span><b>Setup</b> ${game.setup}</span></div>
        ${rulesBlock}
        ${diagramBlock}
      </div>
    </div>
  `;
}

// --- Randomize: a deck that never repeats until every card has been drawn ---
let deck = new Deck([]);
let randomHistory = [];
let randomIndex = -1;
let currentCard = null;

function resetRandom(){
  deck = new Deck(filteredGames());
  randomHistory = [];
  randomIndex = -1;
  currentCard = null;
  updateDeckCount();
}

function updateDeckCount(){
  const el = $('deckCount');
  if(deck.size === 0){ el.textContent = ''; return; }
  const left = `${deck.remaining} of ${deck.size} cards left in the deck`;
  el.textContent = left;
  $('fsHint').textContent = `Swipe for next · ${deck.remaining} left`;
}

function showRandomCard(game, enterClass){
  currentCard = game;
  if(phone.matches){
    openFs();
    $('fsStage').innerHTML = cardHTML(game, enterClass || 'enter-fade');
  } else {
    $('stage').innerHTML = cardHTML(game, enterClass || 'enter-fade');
  }
  updateDeckCount();
}

function drawCard(enterClass){
  const game = deck.draw();
  if(!game){
    renderEmpty(emptyMessage());
    return;
  }
  randomHistory = randomHistory.slice(0, randomIndex + 1); // drop any forward history
  randomHistory.push(game);
  randomIndex = randomHistory.length - 1;
  showRandomCard(game, enterClass);
}

function randomStepForward(){
  if(randomIndex < randomHistory.length - 1){
    randomIndex++;
    showRandomCard(randomHistory[randomIndex], 'enter-right');
  } else {
    drawCard('enter-right');
  }
}

function randomStepBack(){
  if(randomIndex > 0){
    randomIndex--;
    showRandomCard(randomHistory[randomIndex], 'enter-left');
  }
}

// --- Full-screen card on phones ---
function openFs(){
  $('fs').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeFs(){
  if($('fs').hidden) return;
  $('fs').hidden = true;
  document.body.style.overflow = '';
  if(currentCard && mode === 'random') $('stage').innerHTML = cardHTML(currentCard, 'enter-fade');
}
$('fsClose').addEventListener('click', closeFs);
$('fsPrev').addEventListener('click', randomStepBack);
$('fsNext').addEventListener('click', randomStepForward);
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeFs(); });
phone.addEventListener('change', () => { if(!phone.matches) closeFs(); });

// --- List ---
function emptyMessage(){
  return 'No games fit that. Try a different number of players, or turn off a filter.';
}

function updateResultCount(){
  const n = filteredGames().length;
  const narrowed = filters.cat !== 'all' || filters.players !== null || filters.noEquipment;
  $('resultCount').textContent = `${n} game${n === 1 ? '' : 's'}${narrowed ? ` of ${GAMES.length}` : ''}`;
}

function renderList(){
  const games = filteredGames();
  const panel = $('listPanel');
  if(games.length === 0){
    panel.innerHTML = `<div class="list-empty">${emptyMessage()}<br><button class="btn-icon" type="button" data-reset>Clear filters</button></div>`;
    return;
  }
  panel.innerHTML = games.map((g, i) => {
    const rowClass = g.cat === "active" ? "active-cat" : g.cat; // avoid clashing with .active state class
    const secret = g.spoiler ? `<span class="lr-secret" title="Secret rule: tap to reveal">${ICONS.eye} Secret rule</span> · ` : '';
    return `
      <div class="list-row ${rowClass}" data-index="${i}">
        <div class="lr-head">
          <div>
            <div class="lr-title">${g.title}</div>
            <div class="lr-meta">${secret}${(g.diagram && DIAGRAMS[g.title]) ? ICONS.play + ' ' : ''}${CATS[g.cat].label} · ${g.players} players · ${listSetup(g)}</div>
          </div>
          <span class="lr-chevron">›</span>
        </div>
      </div>
    `;
  }).join('');
}

$('listPanel').addEventListener('click', (e) => {
  if(e.target.closest('[data-reset]')){ resetFilters(); return; }
  const row = e.target.closest('.list-row');
  if(row) openListDetail(parseInt(row.dataset.index, 10));
});

// --- List detail (big card) view with swipe/prev/next ---
let detailIndex = 0;

function setHash(game){
  try{ history.replaceState(null, '', game ? shareHash(game) : location.pathname + location.search); }catch(e){}
}

function renderDetailCard(enterClass){
  const games = filteredGames();
  if(games.length === 0) return;
  const game = games[detailIndex];
  $('detailStage').innerHTML = cardHTML(game, enterClass || 'enter-fade');
  $('detailCounter').textContent = `${detailIndex + 1} / ${games.length}`;
  setHash(game);
}

function openListDetail(index){
  detailIndex = index;
  renderDetailCard('enter-fade');
  $('listPanel').style.display = 'none';
  $('listDetail').classList.add('visible');
}

function closeListDetail(){
  if($('listDetail').classList.contains('visible')) setHash(null);
  $('listDetail').classList.remove('visible');
  $('listPanel').style.display = '';
}

function detailStep(delta){
  const games = filteredGames();
  if(games.length === 0) return;
  detailIndex = (detailIndex + delta + games.length) % games.length; // wraps around
  renderDetailCard(delta > 0 ? 'enter-right' : 'enter-left');
}

$('detailBack').addEventListener('click', closeListDetail);
$('detailPrev').addEventListener('click', () => detailStep(-1));
$('detailNext').addEventListener('click', () => detailStep(1));

// swipe + tap support.
// Pointer events drive the drag-follow visual and swipe-to-navigate gesture.
// A plain native click event handles simple taps — more reliable across browsers/previews
// than inferring "tap" purely from pointer movement distance.
function attachSwipeCard(container, { onSwipeLeft, onSwipeRight, onTap }){
  let startX = 0, startY = 0, lastX = 0, lastY = 0, dragging = false, captured = false, cardEl = null, suppressNextClick = false;

  container.addEventListener('pointerdown', (e) => {
    cardEl = container.querySelector('.card');
    if(!cardEl) return;
    startX = lastX = e.clientX; startY = lastY = e.clientY; dragging = true; captured = false;
    cardEl.style.transition = 'none';
  });

  container.addEventListener('pointermove', (e) => {
    if(!dragging || !cardEl) return;
    lastX = e.clientX; lastY = e.clientY;
    const dx = lastX - startX;
    const dy = lastY - startY;
    if(!captured && Math.abs(dx) + Math.abs(dy) > 10){
      // keep receiving events if the pointer leaves the card mid-drag (captured only once it is a drag, so plain taps still click normally)
      try{ container.setPointerCapture(e.pointerId); captured = true; }catch(err){}
    }
    if(swipeDirection(dx, dy, 0)){ // sideways drag: the card follows the finger
      cardEl.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
    }
  });

  function snapBack(el){
    el.style.transition = 'transform .2s ease';
    el.style.transform = 'translateX(0) rotate(0)';
  }

  function endDrag(e){
    if(!dragging || !cardEl) return;
    dragging = false;
    const el = cardEl;
    cardEl = null;

    // A cancel means the browser took the gesture over (usually a vertical scroll of long rules).
    // pointercancel carries no usable position, so use the last move. If it was clearly sideways
    // anyway, still count it as a swipe; otherwise it was a scroll and the card snaps back.
    const cancelled = e.type === 'pointercancel';
    const dx = (cancelled ? lastX : e.clientX) - startX;
    const dy = (cancelled ? lastY : e.clientY) - startY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if(!cancelled && dist < 10){
      // negligible movement — let the native click event handle it as a tap
      el.style.transition = '';
      el.style.transform = '';
      return;
    }

    suppressNextClick = true; // a real drag happened — don't also fire onTap from the click that follows

    const dir = swipeDirection(dx, dy);
    if(dir){
      el.style.transition = 'transform .25s ease, opacity .25s ease';
      el.style.transform = `translateX(${dir === 'left' ? -420 : 420}px) rotate(${dir === 'left' ? -20 : 20}deg)`;
      el.style.opacity = '0';
      setTimeout(() => { if(dir === 'left') onSwipeLeft(); else onSwipeRight(); }, 180);
    } else {
      snapBack(el);
    }
  }

  container.addEventListener('pointerup', endDrag);
  container.addEventListener('pointercancel', endDrag);

  container.addEventListener('click', (e) => {
    if(e.target.closest('[data-share]')) return; // the share button handles itself
    if(suppressNextClick){ suppressNextClick = false; return; }
    const revealEl = container.querySelector('.reveal-block:not(.revealed)');
    if(revealEl){
      revealEl.classList.add('revealed'); // first tap on an unrevealed block (secret rule or diagram) just reveals it
      return;
    }
    if(onTap) onTap();
  });
}

attachSwipeCard($('detailStage'), {
  onSwipeLeft: () => detailStep(1),
  onSwipeRight: () => detailStep(-1),
});
attachSwipeCard($('stage'), {
  onSwipeLeft: randomStepForward,
  onSwipeRight: randomStepBack,
  onTap: randomStepForward,
});
attachSwipeCard($('fsStage'), {
  onSwipeLeft: randomStepForward,
  onSwipeRight: randomStepBack, // no tap-to-advance here: long rules scroll, so taps would be easy to hit by accident
});

// --- Share ---
let toastTimer;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;left:-1000px';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){ return false; }
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-share]');
  if(!btn) return;
  const game = findGameById(GAMES, btn.dataset.share);
  if(!game) return;
  const url = shareUrl(window.location.href, game);
  setHash(game); // the address bar now holds the link too
  toast(await copyText(url) ? 'Link copied' : `Copy this link: ${url}`);
});

// --- Filters and views ---
function refreshView(){
  closeListDetail();
  closeFs();
  updateResultCount();
  const random = mode === "random";
  $('stage').style.display = random ? '' : 'none';
  $('randomControls').style.display = random ? 'flex' : 'none';
  $('deckCount').style.display = random ? '' : 'none';
  $('listPanel').classList.toggle('visible', !random);
  if(random){
    resetRandom();
    renderEmpty(filteredGames().length ? "Draw a card!" : emptyMessage());
  } else {
    renderList();
  }
}

function syncFilterControls(){
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.cat === filters.cat));
  $('playersSelect').value = filters.players === null ? '' : String(filters.players);
  $('noEquipBtn').setAttribute('aria-pressed', String(filters.noEquipment));
}

function resetFilters(){
  Object.assign(filters, NO_FILTERS);
  syncFilterControls();
  refreshView();
}

function setMode(next){
  mode = next;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === next));
}

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    filters.cat = chip.dataset.cat;
    syncFilterControls();
    refreshView();
  });
});

$('playersSelect').addEventListener('change', (e) => {
  filters.players = e.target.value === '' ? null : parseInt(e.target.value, 10);
  refreshView();
});

$('noEquipBtn').addEventListener('click', () => {
  filters.noEquipment = !filters.noEquipment;
  syncFilterControls();
  refreshView();
});

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    setMode(btn.dataset.mode);
    refreshView();
  });
});

$('drawBtn').addEventListener('click', () => drawCard());

// --- theme (light/dark) ---
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try{ localStorage.setItem('hr-theme', theme); }catch(e){}
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('hr-theme'); }catch(e){}
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefersDark ? 'dark' : 'light'));
})();
$('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

// --- opening a link: #g=<game id> shows that game; ?cat=word|dinner|active picks a category ---
function openFromHash(){
  const id = parseShareHash(window.location.hash);
  if(id === null) return false;
  const game = findGameById(GAMES, id);
  if(!game){ toast("That game link doesn't match a game."); return false; }
  Object.assign(filters, NO_FILTERS); // the linked game must not be hidden by a filter
  setMode('list');
  syncFilterControls();
  refreshView();
  openListDetail(filteredGames().findIndex(g => g.id === game.id));
  return true;
}

(function initFromURL(){
  const requestedCat = new URLSearchParams(window.location.search).get('cat');
  if(['word', 'dinner', 'active'].includes(requestedCat)) filters.cat = requestedCat;
  syncFilterControls();
  refreshView();
  openFromHash();
})();
window.addEventListener('hashchange', openFromHash);
</script>

</body>
</html>
